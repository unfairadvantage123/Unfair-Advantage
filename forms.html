<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Form detection</title><meta name="robots" content="noindex"></head>
<body>
<!-- Netlify reads this at deploy time to register the "contact" form. The live form is on index.html. -->
<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field">
  <input type="text" name="first-name">
  <input type="text" name="last-name">
  <input type="email" name="email">
  <input type="tel" name="phone">
  <textarea name="message"></textarea>
</form>
</body></html>
